[project]
name = "agentcore"
version = "0.1.0"
description = "AgentCore — AI agent management plane powered by deepagents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.112.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "langchain-openai>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "deepagents>=0.7.0",
    "langchain-mcp-adapters",
    "apscheduler",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.9",
    "watchfiles>=0.22",
]

[project.optional-dependencies]
sandbox = [
    "langchain-sandbox-opensandbox>=0.1.0",
    "opensandbox>=0.3.0",
]
# PostgreSQL support for LangGraph checkpointer (production)
postgresql = [
    "langgraph-checkpoint-postgres>=0.1.0",
    "asyncpg>=0.29.0",
]
# Full deployment (includes PostgreSQL)
full = [
    "agentcore[postgresql]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
agentcore-api = "agentcore.main:run"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentcore = ["web/**", "runtime/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
